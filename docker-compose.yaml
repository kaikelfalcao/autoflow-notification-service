version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: notification-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: notification
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: notification-rabbit
    ports:
    - "5672:5672"
    - "15672:15672"

volumes:
  mongo_data: