apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: autoflow
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: kaikelfalcao/autoflow-notification:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3005
          envFrom:
            - secretRef:
                name: notification-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
