sonar.projectKey=autoflow-notification-service
sonar.projectName=autoflow-notification-service
sonar.projectVersion=1.0

sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.module.ts,**/*.dto.ts,**/*.schema.ts,**/main.ts,**/*.seed.ts,**/events/*.interface.ts

sonar.tests=src
